name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: npm install -g @anthropic-ai/claude-code@2.1.302
      - run: shellcheck scripts/check-package.sh
      - run: python3 -m unittest discover -s tests -q
      - run: sh scripts/check-package.sh
  python-floor:
    # The skill promises Python 3.9 and later; run the unit tests on the floor and a current release.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -q
